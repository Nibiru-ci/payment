# =============================================================================
#  À copier dans chaque projet : .github/dependabot.yml
#  Dependabot surveille les bibliothèques du projet et propose des mises à jour.
#  Gardez le bloc "github-actions", puis décommentez ce qui correspond au projet.
# =============================================================================
version: 2
updates:
  # --- Toujours présent : met à jour les actions utilisées par les workflows --
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"

